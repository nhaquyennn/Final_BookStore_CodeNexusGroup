<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tạo Yêu Cầu Xóa Khách Hàng</title>
    <link href="assets/css/bootstrap.min.css" rel="stylesheet">
    <link href="assets/css/app-style.css" rel="stylesheet">
</head>

<body class="bg-theme bg-theme2">
    <div class="container mt-5">
        <h3 class="text-center text-white">Tạo Yêu Cầu Xóa Khách Hàng</h3>
        <form>
            <div class="form-group">
                <label for="customerId" class="text-white">Mã khách hàng:</label>
                <input type="text" class="form-control" value="KH001" readonly>
            </div>
            <div class="form-group">
                <label for="customerName" class="text-white">Tên khách hàng:</label>
                <input type="text" class="form-control" value="Nguyễn Văn A" readonly>
            </div>
            <div class="form-group">
                <label for="deleteReason" class="text-white">Lý do xóa:</label>
                <textarea class="form-control" placeholder="Nhập lý do xóa khách hàng"></textarea>
            </div>
            <button type="button" class="btn btn-danger">Gửi</button>
            <button type="button" class="btn btn-secondary">Hủy</button>
        </form>
    </div>
</body>

</html>
